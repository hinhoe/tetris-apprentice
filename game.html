<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
    }

    .game {
        text-align: center;
    }

    h1 {
        margin: 0 0 10px;
    }

    .info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 18px;
    }

    canvas {
        display: block;
        background: #000;
        border: 3px solid #555;
    }

    .controls {
        margin-top: 15px;
        display: grid;
        grid-template-columns: repeat(3, 60px);
        gap: 6px;
        justify-content: center;
    }

    button {
        width: 60px;
        height: 45px;
        border: none;
        border-radius: 8px;
        background: #333;
        color: white;
        font-size: 20px;
        cursor: pointer;
    }

    button:active {
        background: #666;
    }

    .empty {
        visibility: hidden;
    }

    #restart {
        margin-top: 10px;
        width: 190px;
        background: #2563eb;
        font-size: 16px;
    }
</style>
</head>

<body>

<div class="game">
    <h1>TETRIS</h1>

    <div class="info">
        <span>Điểm: <b id="score">0</b></span>
        <span>Level: <b id="level">1</b></span>
    </div>

    <canvas id="game" width="300" height="600"></canvas>

    <div class="controls">
        <button class="empty"></button>
        <button onclick="rotate()">↻</button>
        <button class="empty"></button>

        <button onclick="move(-1)">←</button>
        <button onclick="drop()">↓</button>
        <button onclick="move(1)">→</button>
    </div>

    <button id="restart" onclick="restart()">Chơi lại</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
const SIZE = 30;

const colors = [
    null,
    "#00ffff", // I
    "#ffff00", // O
    "#aa00ff", // T
    "#00ff00", // S
    "#ff0000", // Z
    "#0000ff", // J
    "#ff8800"  // L
];

const pieces = [
    [],
    [[1,1,1,1]],

    [[2,2],
     [2,2]],

    [[0,3,0],
     [3,3,3]],

    [[0,4,4],
     [4,4,0]],

    [[5,5,0],
     [0,5,5]],

    [[6,0,0],
     [6,6,6]],

    [[0,0,7],
     [7,7,7]]
];

let board;
let player;
let score;
let level;
let gameOver;
let dropInterval;
let lastTime = 0;
let dropCounter = 0;

function createBoard() {
    return Array.from(
        {length: ROWS},
        () => Array(COLS).fill(0)
    );
}

function randomPiece() {
    const type = Math.floor(Math.random() * 7) + 1;

    return {
        matrix: pieces[type].map(row => [...row]),
        x: Math.floor(COLS / 2) - 1,
        y: 0
    };
}

function drawCell(x, y, value) {
    ctx.fillStyle = colors[value];
    ctx.fillRect(
        x * SIZE,
        y * SIZE,
        SIZE,
        SIZE
    );

    ctx.strokeStyle = "#222";
    ctx.strokeRect(
        x * SIZE,
        y * SIZE,
        SIZE,
        SIZE
    );
}

function draw() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            if (board[y][x]) {
                drawCell(x, y, board[y][x]);
            }
        }
    }

    player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value) {
                drawCell(
                    player.x + x,
                    player.y + y,
                    value
                );
            }
        });
    });
}

function collision() {
    const m = player.matrix;

    for (let y = 0; y < m.length; y++) {
        for (let x = 0; x < m[y].length; x++) {

            if (!m[y][x]) continue;

            const newX = player.x + x;
            const newY = player.y + y;

            if (
                newX < 0 ||
                newX >= COLS ||
                newY >= ROWS ||
                (newY >= 0 && board[newY][newX])
            ) {
                return true;
            }
        }
    }

    return false;
}

function merge() {
    player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value) {
                board[player.y + y][player.x + x] = value;
            }
        });
    });
}

function clearLines() {
    let lines = 0;

    outer:
    for (let y = ROWS - 1; y >= 0; y--) {

        for (let x = 0; x < COLS; x++) {
            if (!board[y][x]) {
                continue outer;
            }
        }

        board.splice(y, 1);
        board.unshift(Array(COLS).fill(0));

        lines++;
        y++;
    }

    if (lines > 0) {
        score += [0, 100, 300, 500, 800][lines] * level;

        level = Math.floor(score / 1000) + 1;

        dropInterval = Math.max(
            100,
            700 - (level - 1) * 60
        );

        document.getElementById("score").textContent = score;
        document.getElementById("level").textContent = level;
    }
}

function spawn() {
    player = randomPiece();

    if (collision()) {
        gameOver = true;

        setTimeout(() => {
            alert("GAME OVER!\nĐiểm: " + score);
        }, 100);
    }
}

function drop() {
    if (gameOver) return;

    player.y++;

    if (collision()) {
        player.y--;

        merge();
        clearLines();
        spawn();
    }

    dropCounter = 0;
}

function move(direction) {
    if (gameOver) return;

    player.x += direction;

    if (collision()) {
        player.x -= direction;
    }
}

function rotate() {
    if (gameOver) return;

    const oldMatrix = player.matrix;

    // Xoay ma trận 90 độ
    const rotated = oldMatrix[0].map(
        (_, index) =>
            oldMatrix.map(row => row[index]).reverse()
    );

    player.matrix = rotated;

    if (collision()) {
        player.matrix = oldMatrix;
    }
}

function update(time = 0) {
    const delta = time - lastTime;

    lastTime = time;
    dropCounter += delta;

    if (dropCounter > dropInterval) {
        drop();
    }

    draw();

    requestAnimationFrame(update);
}

function restart() {
    board = createBoard();

    score = 0;
    level = 1;
    gameOver = false;

    dropInterval = 700;

    document.getElementById("score").textContent = score;
    document.getElementById("level").textContent = level;

    spawn();
}

document.addEventListener("keydown", event => {

    if (gameOver) return;

    switch (event.key) {

        case "ArrowLeft":
            move(-1);
            break;

        case "ArrowRight":
            move(1);
            break;

        case "ArrowDown":
            drop();
            break;

        case "ArrowUp":
            rotate();
            break;

        case " ":
            while (!collision()) {
                player.y++;
            }

            player.y--;

            merge();
            clearLines();
            spawn();
            break;
    }
});

restart();
update();
</script>

</body>
</html>
